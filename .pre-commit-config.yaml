files: ^rrdf/|^tests/|^system/|\.py$|\.json$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v2.3.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.3
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: https://gitlab.com/bmares/check-json5
    rev: v1.0.0
    hooks:
      - id: check-json5

  - repo: https://github.com/PyCQA/bandit
    rev: '1.8.6'
    hooks:
      - id: bandit
        args: ["-q", "-c", "pyproject.toml", "--severity-level", "high", "--skip", "B602"]
        additional_dependencies: ["bandit[toml]", "pbr"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=2000', '--enforce-all']

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        language: system
        entry: mypy
        args: ["rrdf", "tests"]
        pass_filenames: false

  - repo: local
    hooks:
      - id: uv-lock
        name: ensure uv.lock is updated
        language: system
        entry: uv lock --check
        pass_filenames: false

  - repo: https://github.com/fpgmaas/deptry.git
    rev: '0.12.0'
    hooks:
      - id: deptry
        args: ["--ignore", "DEP001"]
