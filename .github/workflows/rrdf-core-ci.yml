name: rrdf-core CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.10

      - name: Install core package only
        run: |
          uv pip install -e rrdf-core
          uv pip install pytest

      - name: Run core tests
        run: uv run pytest rrdf-core/tests
