name: Test recon_rrdf.py

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - rrdf_file: data/10.1.0/fse_fast_t2_rrdf_20251105_162521.h5
            name: 10.1.0
          - rrdf_file: data/11.0.0/fse_fast_t2_rrdf_20251105_163403.h5
            name: 11.0.0

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        lfs: true

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true

    - name: Install Python
      run: uv python install

    - name: Install the project
      run: uv sync --locked --all-extras --dev

    - name: Run tests
      run: uv run python recon_rrdf.py ${{ matrix.rrdf_file }}
