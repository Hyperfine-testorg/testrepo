name: Publish to Hyperfine's internal Python index

on: 
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, e.g. v1.0.0'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Download .whl from GitHub release
        uses: robinraju/release-downloader@v1
        with:
            fileName: '*.whl'
            tag: ${{ inputs.tag }}
            out-file-path: "dist"
      - name: Publish package
        env:
          USERNAME: ${{ secrets.DEVPI_USERNAME }}
          PASSWORD: ${{ secrets.DEVPI_PASSWORD }}
        run:
          uv publish \
            --publish-url https://devpi.hyperfine-research.com \
            --username "$USERNAME" \
            --password "$PASSWORD" \
            dist/*.whl
            