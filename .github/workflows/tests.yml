name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  core:
    name: rrdf-core tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.10

      - name: Sync dependencies
        run: uv sync --group dev --locked

      - name: Run rrdf-core tests
        run: uv run pytest rrdf-core/tests

  recon:
    name: rrdf-recon tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.10

      - name: Sync dependencies
        run: uv sync --group dev --locked

      - name: Run rrdf-recon tests (light)
        run: uv run pytest rrdf-recon/tests -m "not recon_data"

  recon-cli:
    name: rrdf-recon CLI smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.10

      - name: Sync dependencies
        run: uv sync --group dev --locked

      - name: Run CLI smoke tests
        run: |
          uv run rrdf-recon data/10.1.0/fse_fast_t2_rrdf_20251105_162521.h5
          uv run rrdf-recon data/11.0.0/fse_fast_t2_rrdf_20251105_163403.h5

      - name: Assert CLI outputs exist
        run: |
          set -euo pipefail
          test -f output/fse_fast_t2_rrdf_20251105_162521.png
          test -f output/fse_fast_t2_rrdf_20251105_162521_image.npy
          test -f output/fse_fast_t2_rrdf_20251105_163403.png
          test -f output/fse_fast_t2_rrdf_20251105_163403_image.npy
