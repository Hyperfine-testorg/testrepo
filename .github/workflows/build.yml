name: Build packages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Package builds
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - rrdf-core
          - rrdf-recon
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build wheel
        working-directory: ${{ matrix.package }}
        run: uv build --wheel

