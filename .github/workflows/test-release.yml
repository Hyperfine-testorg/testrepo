name: Test Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number to test (e.g., 0.0.2)'
        required: true
        default: '0.0.2'

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Update version in pyproject.toml (test only)
        run: |
          VERSION=${{ github.event.inputs.version }}
          echo "Testing with version: $VERSION"
          
          # Update the version field in pyproject.toml
          sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml
          
          # Show the change
          echo "Updated pyproject.toml:"
          grep "^version = " pyproject.toml

      - name: Build wheel
        run: |
          uv build

      - name: List built artifacts
        run: |
          echo "Built artifacts:"
          ls -lh dist/

      - name: Upload artifacts for inspection
        uses: actions/upload-artifact@v4
        with:
          name: test-build-artifacts
          path: dist/*
          retention-days: 7

      - name: Verify wheel installation
        run: |
          python -m pip install dist/*.whl
          python -c "import rrdf; print('Successfully imported rrdf')"

      - name: Test Summary
        run: |
          echo "✅ Build test completed successfully!"
          echo ""
          echo "Artifacts built:"
          ls -1 dist/
          echo ""
          echo "This was a test run. No release was created."
          echo "To create an actual release, push a tag to the main branch:"
          echo "  git tag v${{ github.event.inputs.version }}"
          echo "  git push origin v${{ github.event.inputs.version }}"
