[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rrdf-workspace"
version = "0.0.0"
description = "Workspace for the rrdf-core and rrdf-recon packages."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "deptry>=0.24.0",
    "mypy>=1.11.0",
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "ruff>=0.8.0",
    "scipy-stubs>=1.15.3.0",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
namespace_packages = true
