[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rrdf"
version = "0.0.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "h5py>=3.13.0",
    "imageio>=2.37.0",
    "numba>=0.62.1",
    "numpy>=1.23.5",
    "scipy>=1.14.1",
    "xarray>=0.21.1",
]

[dependency-groups]
dev = [
    "mypy>=1.11.0",
    "pytest>=8.4.2",
    "ruff>=0.8.0",
    "scipy-stubs>=1.15.3.0",
]
