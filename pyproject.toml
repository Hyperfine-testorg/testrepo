[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "rrdf"
dynamic = ["version"]
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "h5py>=3.13.0",
    "imageio>=2.9.0",
    "numba>=0.60.0",
    "numpy>=1.23.5",
    "scipy>=1.14.1",
    "xarray>=0.21.1",
]

[dependency-groups]
dev = [
    "mypy>=1.11.0",
    "pytest>=8.4.2",
    "ruff>=0.8.0",
    "scipy-stubs>=1.15.3.0",
]

[tool.hatch.version]
source = "vcs"
