[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "rrdf"
dynamic = ["version"]
description = "Image reconstruction library for Hyperfine RRDF data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "h5py>=3.13.0",
    "imageio>=2.9.0",
    "numba>=0.60.0",
    "numpy>=1.23.5",
    "scipy>=1.14.1",
    "xarray>=0.21.1",
    "simpleitk>=2.1.1.2",
]

[dependency-groups]
dev = [
    "deptry>=0.24.0",
    "mypy>=1.11.0",
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "ruff>=0.8.0",
    "scipy-stubs>=1.15.3.0",
]

[tool.hatch.version]
source = "vcs"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
namespace_packages = true
